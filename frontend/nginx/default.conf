# HTTP simple : développement et recette sur le réseau interne.
# En production, docker-compose.prod.yml remplace ce fichier par https.conf.
upstream optilink_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|admin|static)/ {
        include /etc/nginx/snippets/optilink-proxy.conf;
        proxy_pass http://optilink_api;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
