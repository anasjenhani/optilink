# HTTP simple : développement et recette sur le réseau interne.
# En production, docker-compose.prod.yml remplace ce fichier par https.conf.
# Adresse du backend relue régulièrement : après une mise à jour, le conteneur recréé change
# d'adresse IP, et Nginx ne doit pas rester sur l'ancienne (erreur 502).
upstream optilink_api {
    zone optilink_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|admin|static)/ {
        include /etc/nginx/snippets/optilink-proxy.conf;
        proxy_pass http://optilink_api;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
