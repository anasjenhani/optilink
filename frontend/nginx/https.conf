# Production : HTTPS obligatoire (TLS 1.2 minimum), HTTP redirigé.
# Certificats attendus dans /etc/nginx/certs (voir README).
upstream optilink_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/optilink.crt;
    ssl_certificate_key /etc/nginx/certs/optilink.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    limit_req zone=optilink_api burst=50 nodelay;

    location ~ ^/(api|admin|static)/ {
        include /etc/nginx/snippets/optilink-proxy.conf;
        proxy_pass http://optilink_api;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
