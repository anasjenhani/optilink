# Services applicatifs OptiLink. PostgreSQL est externe en production
# (serveur dédié) ; docker-compose.dev.yml en ajoute un pour le développement.
x-backend: &backend
  build: ./backend
  image: optilink-backend
  env_file: .env
  environment:
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUN_MIGRATIONS: "1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/sante/', timeout=5)"
      interval: 15s
      start_period: 60s
      retries: 5

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build: ./frontend
    image: optilink-web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
