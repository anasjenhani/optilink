name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: optilink
          POSTGRES_USER: optilink
          POSTGRES_PASSWORD: ci-optilink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optilink"
          --health-interval 5s
          --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_HOST: localhost
      DB_USER: optilink
      DB_PASSWORD: ci-optilink
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests sur PostgreSQL
        run: pytest
      - name: Schéma OpenAPI valide
        run: python manage.py spectacular --validate --fail-on-warn > /dev/null
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image backend
        run: docker build -t optilink-backend ./backend
      - name: Image web
        run: docker build -t optilink-web ./frontend
      - name: Nginx accepte la configuration HTTPS
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout certs/optilink.key -out certs/optilink.crt
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/certs:/etc/nginx/certs:ro" optilink-web nginx -t
