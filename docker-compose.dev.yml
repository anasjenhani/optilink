# Développement : ajoute un SQL Server local et les réglages Django de dev.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
x-dev-env: &dev-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DB_HOST: sqlserver
  DB_TRUST_SERVER_CERTIFICATE: "1"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      start_period: 30s
      retries: 10

  # Crée la base au premier démarrage (Django ne la crée pas lui-même).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-optilink}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -Q "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME]"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  backend:
    environment:
      <<: *dev-env
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *dev-env

  beat:
    environment:
      <<: *dev-env

volumes:
  sqlserver-data:
