# Développement : ajoute un PostgreSQL local et les réglages Django de dev.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
x-dev-env: &dev-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DB_HOST: postgres
  DB_SSLMODE: disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Super-utilisateur réservé à l'administration ; l'application utilise DB_USER.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      APP_DB_NAME: ${DB_NAME:-optilink}
      APP_DB_USER: ${DB_USER:-optilink}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$APP_DB_NAME\""]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    environment:
      <<: *dev-env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    environment:
      <<: *dev-env

  beat:
    environment:
      <<: *dev-env

volumes:
  postgres-data:
